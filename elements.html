}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
const PI=Math.PI, SQ3=Math.sqrt(3);
const FAMS=[
  {id:'R1',name:'R1 뼈대',c:'--ink'},
  {id:'R2',name:'R2 끼우기',c:'--capsule'},
  {id:'R3f',name:'R3 채우기',c:'--deck'},
  {id:'R3v',name:'R3 비우기',c:'--void'},
  {id:'R4',name:'R4 사선',c:'--stair'},
  {id:'Fa',name:'파사드',c:'--facade'},
  {id:'Gr',name:'그린',c:'--green'}
];

/* ---------- materials ---------- */
const M={
  frame:new THREE.MeshStandardMaterial({roughness:.6,metalness:.1}),
  capsule:new THREE.MeshStandardMaterial({roughness:.45}),
  capLine:new THREE.LineBasicMaterial(),
  deck:new THREE.MeshStandardMaterial({roughness:.85}),
  deckGlass:new THREE.MeshStandardMaterial({roughness:.3,transparent:true,opacity:.4,depthWrite:false}),
  stair:new THREE.MeshStandardMaterial({roughness:.7}),
  facade:new THREE.MeshStandardMaterial({roughness:.7}),
  perf:new THREE.MeshStandardMaterial({roughness:.7,side:THREE.DoubleSide,alphaTest:.5}),
  cloth:new THREE.MeshStandardMaterial({roughness:.9,side:THREE.DoubleSide,transparent:true,opacity:.6,depthWrite:false}),
  glassF:new THREE.MeshStandardMaterial({roughness:.1,side:THREE.DoubleSide,transparent:true,opacity:.22,depthWrite:false}),
  leaf:new THREE.MeshStandardMaterial({roughness:.9,flatShading:true}),
  pot:new THREE.MeshStandardMaterial({roughness:.9}),
  soil:new THREE.MeshStandardMaterial({roughness:1}),
  voidm:new THREE.MeshStandardMaterial({transparent:true,opacity:.07,depthWrite:false}),
  paving:new THREE.MeshStandardMaterial({roughness:1}),
  ghost:new THREE.LineDashedMaterial({dashSize:.14,gapSize:.1,transparent:true,opacity:.75}),
  ghostSolid:new THREE.LineBasicMaterial({transparent:true,opacity:.6}),
  dim:new THREE.LineBasicMaterial(),
  ground:new THREE.MeshStandardMaterial({roughness:1})
};
(function perfTex(){
  const c=document.createElement('canvas'); c.width=552; c.height=520;
  const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.fillStyle='#000';
  for(let i=5;i<c.width;i+=10)for(let j=5;j<c.height;j+=10){x.beginPath();x.arc(i,j,2.2,0,PI*2);x.fill();}
  M.perf.alphaMap=new THREE.CanvasTexture(c);
})();

function tok(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
let INK='#1c2125', PANEL='#f7f8f5';
function applyColors(){
  const c=n=>new THREE.Color(tok(n));
  const bg=c('--panel'), ink=c('--ink'), dark=bg.getHSL({}).l<.5;
  INK=tok('--ink'); PANEL=tok('--panel');
  M.frame.color=ink;
  M.capsule.color=c('--capsule').lerp(bg,dark?.55:.62); M.capLine.color=c('--capsule');
  M.deck.color=c('--deck'); M.deckGlass.color=c('--deck');
  M.stair.color=c('--stair');
  M.facade.color=c('--facade'); M.perf.color=c('--facade'); M.cloth.color=c('--facade'); M.glassF.color=c('--facade');
  M.leaf.color=c('--green');
  M.pot.color=c('--muted'); M.soil.color=c('--muted').lerp(ink,.35);
  M.voidm.color=c('--void'); M.paving.color=c('--muted').lerp(bg,.5);
  M.ghost.color=c('--void'); M.ghostSolid.color=c('--void');
  M.dim.color=ink;
  M.ground.color=bg.clone().lerp(ink,dark?.03:.04);
}

/* ---------- geometry helpers (metres) ---------- */
const UNIT=new THREE.BoxGeometry(1,1,1); UNIT.userData.shared=true;
const UP=new THREE.Vector3(0,1,0);
const V=a=>new THREE.Vector3(a[0],a[1],a[2]);
function sh(m){m.castShadow=!m.material.transparent; m.receiveShadow=true; return m;}
function B(g,w,h,d,x,y,z,mat,rz,ry){const m=new THREE.Mesh(UNIT,mat);m.scale.set(w,h,d);m.position.set(x,y,z);if(rz)m.rotation.z=rz;if(ry)m.rotation.y=ry;g.add(sh(m));return m;}
function bar(g,p,q,t,mat){
  const a=V(p),b=V(q),d=b.clone().sub(a),L=d.length();
  const m=new THREE.Mesh(UNIT,mat||M.frame); m.scale.set(t,L+t,t);
  m.position.copy(a).add(b).multiplyScalar(.5); m.quaternion.setFromUnitVectors(UP,d.normalize());
  g.add(sh(m)); return m;
}
function cubeFrame(g,x,y,z,s,t){
  const P=(i,j,k)=>[x+i*s,y+j*s,z+k*s];
  for(const a of[0,1])for(const b of[0,1]){bar(g,P(0,a,b),P(1,a,b),t);bar(g,P(a,0,b),P(a,1,b),t);bar(g,P(a,b,0),P(a,b,1),t);}
}
function lines(g,segs,mat){
  const arr=[]; segs.forEach(s=>arr.push(...s[0],...s[1]));
  const geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.Float32BufferAttribute(arr,3));
  const l=new THREE.LineSegments(geo,mat||M.ghost); if(l.material.isLineDashedMaterial) l.computeLineDistances(); g.add(l); return l;
}
function ghostBox(g,x,y,z,w,h,d){
  const P=(i,j,k)=>[x+i*w,y+j*h,z+k*d], s=[];
  for(const a of[0,1])for(const b of[0,1]){s.push([P(0,a,b),P(1,a,b)],[P(a,0,b),P(a,1,b)],[P(a,b,0),P(a,b,1)]);}
  lines(g,s);
}
function ghostPrism(g,pts,y0,h){
  const s=[],n=pts.length;
  for(let i=0;i<n;i++){const a=pts[i],b=pts[(i+1)%n];
    s.push([[a[0],y0,a[1]],[b[0],y0,b[1]]],[[a[0],y0+h,a[1]],[b[0],y0+h,b[1]]],[[a[0],y0,a[1]],[a[0],y0+h,a[1]]]);}
  lines(g,s);
}
function prismFrame(g,pts,y0,h,t){
  const n=pts.length;
  for(let i=0;i<n;i++){const a=pts[i],b=pts[(i+1)%n];
    bar(g,[a[0],y0,a[1]],[b[0],y0,b[1]],t); bar(g,[a[0],y0+h,a[1]],[b[0],y0+h,b[1]],t); bar(g,[a[0],y0,a[1]],[a[0],y0+h,a[1]],t);}
}
const hexPts=(a,cx=0,cz=0)=>[0,1,2,3,4,5].map(k=>[cx+a*Math.cos(k*PI/3),cz+a*Math.sin(k*PI/3)]);
const triPts=(a,cx=0,cz=0)=>{const R=a/SQ3;return[-90,30,150].map(d=>[cx+R*Math.cos(d*PI/180),cz+R*Math.sin(d*PI/180)]);};
function polySlab(g,pts,y0,t,mat){
  const s=new THREE.Shape(); pts.forEach((p,i)=>i?s.lineTo(p[0],-p[1]):s.moveTo(p[0],-p[1]));
  const geo=new THREE.ExtrudeGeometry(s,{depth:t,bevelEnabled:false}); geo.rotateX(-PI/2); geo.translate(0,y0,0);
  const m=new THREE.Mesh(geo,mat); g.add(sh(m)); return m;
}
function roundedPoly(pts,r){
  const n=pts.length,A=[],Bp=[];
  for(let i=0;i<n;i++){
    const c=pts[i],p=pts[(i-1+n)%n],q=pts[(i+1)%n];
    const v1=[p[0]-c[0],p[1]-c[1]],v2=[q[0]-c[0],q[1]-c[1]];
    const l1=Math.hypot(...v1),l2=Math.hypot(...v2);
    A[i]=[c[0]+v1[0]/l1*r,c[1]+v1[1]/l1*r]; Bp[i]=[c[0]+v2[0]/l2*r,c[1]+v2[1]/l2*r];
  }
  const s=new THREE.Shape(); s.moveTo(A[0][0],A[0][1]);
  for(let i=0;i<n;i++){s.quadraticCurveTo(pts[i][0],pts[i][1],Bp[i][0],Bp[i][1]); const a=A[(i+1)%n]; s.lineTo(a[0],a[1]);}
  return s;
}
function outline(g,geo,pos){const l=new THREE.LineSegments(new THREE.EdgesGeometry(geo,35),M.capLine); if(pos) l.position.copy(pos); g.add(l);}
function capRect(g,w,h,d,cx,y0,cz){
  const b=.07,iw=w-2*b,ih=h-2*b,r=Math.min(iw,ih)*.28;
  const geo=new THREE.ExtrudeGeometry(roundedPoly([[-iw/2,-ih/2],[iw/2,-ih/2],[iw/2,ih/2],[-iw/2,ih/2]],r),{depth:d-2*b,bevelEnabled:true,bevelThickness:b,bevelSize:b,bevelSegments:3,curveSegments:8});
  geo.translate(0,0,-(d-2*b)/2);
  const m=new THREE.Mesh(geo,M.capsule); m.position.set(cx,y0+h/2,cz); g.add(sh(m)); outline(g,geo,m.position);
}
function capPrism(g,pts,y0,h,r){
  const b=.07;
  const geo=new THREE.ExtrudeGeometry(roundedPoly(pts.map(p=>[p[0],-p[1]]),r),{depth:h-2*b,bevelEnabled:true,bevelThickness:b,bevelSize:b,bevelSegments:3,curveSegments:8});
  geo.rotateX(-PI/2); geo.translate(0,y0+b,0);
  const m=new THREE.Mesh(geo,M.capsule); g.add(sh(m)); outline(g,geo);
}
function shrub(g,x,y,z,r){const m=new THREE.Mesh(new THREE.IcosahedronGeometry(r,0),M.leaf);m.position.set(x,y,z);g.add(sh(m));}
function mkRng(seed){let a=seed;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function edgeOut(pts,k,len){ /* outward normal of edge k scaled */
  const a=pts[k],b=pts[(k+1)%pts.length],cx=pts.reduce((s,p)=>s+p[0],0)/pts.length,cz=pts.reduce((s,p)=>s+p[1],0)/pts.length;
  let nx=b[1]-a[1],nz=-(b[0]-a[0]); const l=Math.hypot(nx,nz); nx/=l; nz/=l;
  const mx=(a[0]+b[0])/2-cx,mz=(a[1]+b[1])/2-cz; if(nx*mx+nz*mz<0){nx=-nx;nz=-nz;}
  return[nx*len,nz*len];
}

/* dimension lines */
const labelTex=[];
function label(g,text,pos){
  const c=document.createElement('canvas'),x=c.getContext('2d'),fs=40;
  x.font='500 '+fs+'px "IBM Plex Mono", monospace';
  const w=Math.ceil(x.measureText(text).width)+28,h=60; c.width=w; c.height=h;
  x.font='500 '+fs+'px "IBM Plex Mono", monospace';
  x.fillStyle=PANEL; x.globalAlpha=.85; x.fillRect(0,0,w,h); x.globalAlpha=1;
  x.fillStyle=INK; x.textBaseline='middle'; x.textAlign='center'; x.fillText(text,w/2,h/2+2);
  const t=new THREE.CanvasTexture(c); labelTex.push(t);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthTest:false,transparent:true}));
  s.scale.set(w/h*.3,.3,1); s.position.copy(pos); s.renderOrder=20; g.add(s);
}
function dim(g,p1,p2,off,text){
  const a=V(p1),b=V(p2),o=V(off),on=o.clone().normalize();
  const a2=a.clone().add(o),b2=b.clone().add(o);
  const dir=b2.clone().sub(a2).normalize(),tk=dir.clone().add(on).normalize().multiplyScalar(.09);
  const P=v=>[v.x,v.y,v.z];
  const segs=[
    [P(a.clone().addScaledVector(on,.06)),P(a2.clone().addScaledVector(on,.12))],
    [P(b.clone().addScaledVector(on,.06)),P(b2.clone().addScaledVector(on,.12))],
    [P(a2),P(b2)],
    [P(a2.clone().sub(tk)),P(a2.clone().add(tk))],[P(b2.clone().sub(tk)),P(b2.clone().add(tk))]
  ];
  const l=lines(g,segs,M.dim); l.renderOrder=19;
  label(g,text,a2.clone().add(b2).multiplyScalar(.5).addScaledVector(on,.24));
}

/* V-stair used by element 24 */
function vStair(g,x0,y0,z0){
  const S=3,n=7,L=S*.62,rise=S/2/n,run=L/n,xs=x0+S*.12,w=1.2,zA=z0+S*.27,zB=z0+S*.73;
  for(let s=0;s<n;s++) B(g,run*1.02,.06,w,xs+run*(s+.5),y0+rise*(s+1),zA,M.stair);
  B(g,S*.2,.08,S*.86,xs+L+S*.1,y0+S/2,z0+S/2,M.stair);
  for(let s=0;s<n;s++) B(g,run*1.02,.06,w,xs+L-run*(s+.5),y0+S/2+rise*(s+1),zB,M.stair);
  const len=Math.hypot(L,S/2),a=Math.atan2(S/2,L);
  B(g,len,.16,.05,xs+L/2,y0+S/4,zA-w/2,M.stair,a);
  B(g,len,.16,.05,xs+L/2,y0+S*.75,zB+w/2,M.stair,-a);
}

/* ---------- 38 elements ---------- */
const T=.15;

/* ---------- three: shared ---------- */
function lights(scene){
  scene.add(new THREE.HemisphereLight(0xffffff,0x888888,.7));
  const d=new THREE.DirectionalLight(0xffffff,.7); d.position.set(8,14,10); scene.add(d); return d;
}
function disposeGroup(g){
  g.traverse(o=>{ if(o.geometry && !o.geometry.userData.shared) o.geometry.dispose(); if(o.isSprite) o.material.dispose(); });
}
function fit(cam,box,dirv,margin){
  const c=box.getCenter(new THREE.Vector3()),s=box.getSize(new THREE.Vector3());
  const r=Math.max(s.x,s.y,s.z,1)*.5*Math.sqrt(2);
  const fov=cam.fov*PI/180, dist=r/Math.sin(fov/2)*margin/Math.min(1,cam.aspect);
  cam.position.copy(c).addScaledVector(dirv.clone().normalize(),dist); cam.near=dist/50; cam.far=dist*10;
  cam.lookAt(c); cam.updateProjectionMatrix(); return c;
}
const VIEW=new THREE.Vector3(1,.75,1.25);

  E.forEach(e=>{

}

sun.castShadow=true; sun.shadow.mapSize.set(2048,2048); sun.shadow.bias=-.0004;

function buildMain(n,refit){
  const e=E.find(x=>x.n===n);
  if(group){scene.remove(group);disposeGroup(group);}
  labelTex.splice(0).forEach(t=>t.dispose());
  group=new THREE.Group(); e.b(group);
  const box=new THREE.Box3().setFromObject(group);
  dimGroup=new THREE.Group(); e.d(dimGroup); dimGroup.visible=dimToggle.checked; group.add(dimGroup);
  scene.add(group);
  if(refit){
    const big=box.clone().union(new THREE.Box3().setFromObject(dimGroup));
    const c=fit(cam,big,VIEW,1.08); ctl.target.copy(c); ctl.update();
    sun.target.position.copy(c); scene.add(sun.target); sun.position.copy(c).add(new THREE.Vector3(8,14,10));
  }
}

function select(n){
  document.querySelectorAll('.tile').forEach(t=>t.setAttribute('aria-pressed',t.id==='el-'+n?'true':'false'));
  current=n; buildMain(n,true); card(E.find(x=>x.n===n));
}
function resize(){
  const w=vp.clientWidth,h=vp.clientHeight; if(!w||!h) return;
  R.setSize(w,h,false); cam.aspect=w/h; cam.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(vp);

function applyTheme(){
  applyColors();
  scene.background=new THREE.Color(tok('--panel'));
  renderThumbs(); buildMain(current,false);
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
